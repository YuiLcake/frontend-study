<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="熙熙的练习" />
    <title>熙熙的练习</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      .top {
        max-width: 800px;
        margin: 0 auto;
      }
      .card {
        font-size: 16px;
        position: relative;
        padding: 16px 20px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
        border-radius: 8px;
        background-color: #ffffff;
      }
      .label {
        position: absolute;
        top: 8px;
        right: 12px;
        font-size: 12px;
        background: #dddcdc;
        padding: 2px 8px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <article class="card">
        <span class="label">小标签</span>

        <p>这是内容区域。</p>
      </article>
      <article class="card">
        <span class="label">小标签</span>
        <p>这是内容区域。</p>
      </article>
      <article class="card">
        <span class="label">小标签</span>
        <p>这是内容区域。</p>
      </article>
    </div>
  </body>
</html>
