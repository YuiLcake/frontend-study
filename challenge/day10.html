<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="熙熙的网页练习" />
    <title>网页练习</title>
    <style>
      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }
      body {
        background-color: #0d1117;
        font-size: 14px;
        font-family:
          "Mona Sans VF",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans Backtick Fix",
          "Noto Sans",
          Helvetica,
          Arial,
          sans-serif,
          "Apple Color Emoji",
          "Segoe UI Emoji";
      }
      h1 {
        color: #f0f6fc;
      }
      .content {
        flex: 1;
        min-width: 0;
      }
      .repo-list {
        list-style: none;
        padding: 0;
      }
      .project {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px 0;
        border-bottom: 1px solid rgba(61, 68, 77, 0.7);
      }
      .repo-head {
        display: flex;
        gap: 5px;
        align-items: baseline;
      }
      .repo-name {
        font-size: 20px;
        color: #4493f8;
        text-decoration: none;
      }
      .label {
        padding: 0 6px 0 6px;
        font-size: 12px;
        color: #9198a1;
        border: 1px solid #9198a1;
        border-radius: 4px;
      }
      .repo-meta {
        display: flex;
        gap: 15px;
        color: #9198a1;
      }
      .language {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #e34c26;
      }
      .star {
        background-color: #212830;
        padding: 3px 12px;
        border-width: 1px 1px 1px 1px;
        border-style: solid;
        border-color: #9198a1;
        border-radius: 6px;
      }
      .startext {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: none;
        color: #f0f6fc;
      }
    </style>
  </head>

  <body>
    <h1>Your Repositories</h1>
    <ul class="repo-list">
      <li class="project">
        <div class="content">
          <div class="repo-head">
            <h2><a href="#" class="repo-name">frontend-study</a></h2>
            <span class="label">Public</span>
          </div>
          <div class="repo-meta">
            <div class="language">
              <span class="dot"></span>
              HTML
            </div>
            <div>Updated 18 hours ago</div>
          </div>
        </div>

        <div class="star">
          <a href="#" class="startext">
            <svg
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"
              />
            </svg>
            Star
          </a>
        </div>
      </li>
    </ul>
  </body>
</html>
